<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon XO Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="cyber-container">
        <h1 class="neon-title">NEON<span class="xoxo">XO</span></h1>
        <div class="game-board" id="board">
            <div class="cyber-cell" data-cell-index="0"></div>
            <div class="cyber-cell" data-cell-index="1"></div>
            <div class="cyber-cell" data-cell-index="2"></div>
            <div class="cyber-cell" data-cell-index="3"></div>
            <div class="cyber-cell" data-cell-index="4"></div>
            <div class="cyber-cell" data-cell-index="5"></div>
            <div class="cyber-cell" data-cell-index="6"></div>
            <div class="cyber-cell" data-cell-index="7"></div>
            <div class="cyber-cell" data-cell-index="8"></div>
        </div>
        <div class="hud">
            <div class="status" id="status">PLAYER X TURN</div>
            <button class="cyber-button" id="resetBtn">
                <span class="glow"></span>
                <span class="button-text">SYSTEM REBOOT</span>
            </button>
        </div>
    </div>

    <!-- Background Music Elements -->
    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-tech-ambient-3892.mp3" type="audio/mpeg">
    </audio>
    <div class="mute-btn" id="muteBtn">🔊</div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
